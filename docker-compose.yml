services:
  postgres:
    image: postgres:18
    container_name: local-postgres
    restart: unless-stopped
    environment:
      # These only take effect the first time the data volume is created.
      POSTGRES_USER: budget
      POSTGRES_DB: zero_budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d zero_budget"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
